  --link: #c8291d;
  --night: #0e0d1b;         /* announcement strip, featured card, footer */
  --night-ink: #ffffff;
  --night-muted: #9c9aab;
  --bar: #0e0d1b;
  --good: #23784a;  --good-bg: #e3f3e9;
  --warn: #7a4f0f;  --warn-bg: #fff4e5;   /* site warning band */
  --bad: #b3261e;   --bad-bg: #ffe9e7;
  --muted-bg: #f2f1f8;      /* site --accent-soft */
  --accent-text: #d6301f;   /* small red labels on white / warm grey (4.5:1) */
  --brand-hover: #a92016;
  --field-line: #8a8a94;    /* form field borders (3:1) */
  --backdrop: rgba(14, 13, 27, .55);
  /* featured (first) stat tile: the site's dark plan card */
  --feature-bg: #0e0d1b; --feature-line: #0e0d1b; --feature-ink: #ffffff; --feature-muted: #9c9aab; --feature-hint: #ff8a80;
  --radius: 8px;
  --radius-lg: 16px;
  --shadow: 0 4px 16px rgba(26, 26, 26, .08);
  --shadow-lg: 0 12px 40px rgba(26, 26, 26, .10);
  --display: "Poppins", "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --sans: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --container: 1180px;
  --logo-light: block; --logo-dark: none; --footer-line: transparent;
  color-scheme: light;
}
/* dark tokens are screen-only: print and the saved printable page always use the light tokens above */
@media screen and (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0a16;
    --surface: #15142a;
    --surface-2: #1b1a32;
    --ink: #f2f1f8;
    --ink-2: #b9b7c9;
    --ink-3: #9c9aab;
    --line: #2a2942;
    --line-soft: #201f37;
    --brand: #d9372b;
    --brand-ink: #ffffff;
    --brand-soft: #3a1d22;
    --accent: #ff6b61;
    --link: #ff8a80;
    --night: #05040d;
    --bar: #c9c7dd;
    --good: #7fd6a0;  --good-bg: #16301f;
    --warn: #f0c46a;  --warn-bg: #33270f;
    --bad: #ff8f86;   --bad-bg: #3a1d22;
    --muted-bg: #222139;
    --accent-text: #ff6b61;
    --field-line: #6b6990;
    --backdrop: rgba(0, 0, 0, .7);
    --feature-bg: #221c33; --feature-line: rgba(255, 107, 97, .4); --feature-muted: #b9b7c9;
    --shadow: none;
    --shadow-lg: 0 12px 40px rgba(0, 0, 0, .45);
    --logo-light: none; --logo-dark: inline-flex; --footer-line: #2a2942;
    color-scheme: dark;
  }
}
@media screen {
  :root[data-theme="dark"] {
    --bg: #0b0a16;
    --surface: #15142a;
    --surface-2: #1b1a32;
    --ink: #f2f1f8;
    --ink-2: #b9b7c9;
    --ink-3: #9c9aab;
    --line: #2a2942;
    --line-soft: #201f37;
    --brand: #d9372b;
    --brand-ink: #ffffff;
    --brand-soft: #3a1d22;
    --accent: #ff6b61;
    --link: #ff8a80;
    --night: #05040d;
    --bar: #c9c7dd;
    --good: #7fd6a0;  --good-bg: #16301f;
    --warn: #f0c46a;  --warn-bg: #33270f;
    --bad: #ff8f86;   --bad-bg: #3a1d22;
    --muted-bg: #222139;
    --accent-text: #ff6b61;
    --field-line: #6b6990;
    --backdrop: rgba(0, 0, 0, .7);
    --feature-bg: #221c33; --feature-line: rgba(255, 107, 97, .4); --feature-muted: #b9b7c9;
    --shadow: none;
    --shadow-lg: 0 12px 40px rgba(0, 0, 0, .45);
    --logo-light: none; --logo-dark: inline-flex; --footer-line: #2a2942;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font: 15px/1.55 var(--sans);
  color: var(--ink);
  background:
    radial-gradient(900px 420px at 88% 0, rgba(255, 68, 56, .07), transparent 65%),
    var(--bg);
  background-repeat: no-repeat;
  background-color: var(--bg);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
h1, h2, h3 { margin: 0; font-family: var(--display); font-weight: 500; color: var(--ink); text-wrap: balance; }
h1 { font-size: clamp(26px, 3.2vw, 38px); line-height: 1.12; letter-spacing: -.02em; }
h2 { font-size: 18px; letter-spacing: -.01em; }
h3 { font-size: 15px; }
h1 em, h2 em { font-style: italic; color: var(--accent); font-weight: 400; }
a { color: var(--link); }
button, input, select, textarea { font: inherit; color: inherit; }
.container { width: 100%; max-width: calc(var(--container) + 48px); margin: 0 auto; padding-inline: 24px; }

/* ---------- announcement strip + header (as on the site) ---------- */
.topbar { background: var(--night); color: var(--night-ink); font-size: 13px; font-weight: 500; letter-spacing: .04em; }
.topbar .container { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 40px; }
.topbar .tagline { opacity: .92; }
.topbar .tagline a { color: inherit; text-decoration: none; border-bottom: 1px solid rgba(255, 255, 255, .3); }

.site-header { background: var(--surface); border-bottom: 1px solid var(--line-soft); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.header-inner { display: flex; align-items: center; gap: 28px; min-height: 84px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; flex: none; }
/* light theme: the full lockup; dark theme: the red house-and-key mark + "Estia" (the lockup's dark ink would vanish) */
.brand-logo { height: 46px; width: auto; display: var(--logo-light); }
.brand-mark { display: var(--logo-dark); align-items: center; gap: 10px; font: 600 26px/1 var(--display); color: var(--ink); letter-spacing: .01em; }
.brand-mark img { width: 42px; height: 42px; display: block; }
.brand-tag { font-size: 11px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--link); background: var(--brand-soft); padding: 4px 9px; border-radius: 100px; }
nav { display: flex; align-items: center; gap: 4px; flex: 1; min-width: 0; justify-content: center; }
nav a {
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  padding: 8px 12px; border-radius: 100px; color: var(--ink-2); text-decoration: none; font-size: 15px; font-weight: 500;
}
nav a:hover { color: var(--ink); background: var(--surface-2); }
nav a.active { color: var(--link); font-weight: 600; }
.badge { background: var(--brand); color: var(--brand-ink); border-radius: 100px; font-size: 11px; line-height: 1; padding: 4px 7px; font-weight: 700; }
.header-cta { flex: none; box-shadow: 0 2px 12px rgba(255, 68, 56, .25); }

/* sync status lives in the announcement strip */
.sync { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--night-muted); white-space: nowrap; }
.sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--night-muted); flex: none; }
.sync.synced::before { background: #4cc97a; }
.sync.saving::before, .sync.loading::before { background: #f5b53d; }
/* a failed save must stay visible: it floats bottom-left once the strip has scrolled away */
.sync.error { color: #ffb4ad; position: fixed; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 19; background: var(--night); padding: 8px 14px; border-radius: 100px; box-shadow: var(--shadow-lg); white-space: normal; max-width: calc(100vw - 32px); }
.sync.error::before { background: var(--accent); }
.topbar .sync { margin-left: auto; }
.topbar .signout { color: var(--night-ink); text-decoration: none; font-size: 12.5px; white-space: nowrap; border-bottom: 1px solid rgba(255, 255, 255, .3); }

/* ---------- page ---------- */
main { flex: 1; padding-block: 36px 72px; min-width: 0; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px 20px; flex-wrap: wrap; margin-bottom: 26px; }
.page-head > div:first-child { min-width: 0; }
.page-head .sub { color: var(--ink-2); margin-top: 8px; font-size: 16px; max-width: 62ch; }
.eyebrow { display: block; font-size: 12.5px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--accent-text); margin-bottom: 12px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
.muted { color: var(--ink-3); }
.small { font-size: 13px; }
.num { font-variant-numeric: tabular-nums; text-align: right; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); }
.card-pad { padding: 22px 24px; }
.card-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 18px 24px; border-bottom: 1px solid var(--line-soft); gap: 4px 10px; }
.card-head a { font-weight: 700; font-size: 13.5px; text-decoration: none; white-space: nowrap; }
.card-head a::after { content: " →"; }
.grid { display: grid; gap: 20px; }
.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }

/* stat tiles: the plan-card treatment; the first tile of a row is the dark "featured" card */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 22px; }
.stat { padding: 20px 22px; }
.stat .label { color: var(--ink-2); font-size: 11.5px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
.stat .value { font-family: var(--display); font-weight: 500; font-size: 32px; line-height: 1.1; letter-spacing: -.03em; margin-top: 10px; font-variant-numeric: tabular-nums; }
.stat .hint { color: var(--ink-3); font-size: 13px; margin-top: 6px; }
.stats > .stat:first-child { background: var(--feature-bg); border-color: var(--feature-line); }
.stats > .stat:first-child .label { color: var(--feature-muted); }
.stats > .stat:first-child .value { color: var(--feature-ink); }
.stats > .stat:first-child .hint { color: var(--feature-hint); font-weight: 600; }
/* only the first stats row on a page gets the featured card */
.stats ~ .stats > .stat:first-child { background: var(--surface); border-color: var(--line); }
.stats ~ .stats > .stat:first-child .label { color: var(--ink-2); }
.stats ~ .stats > .stat:first-child .value { color: var(--ink); }
.stats ~ .stats > .stat:first-child .hint { color: var(--ink-3); font-weight: 400; }

/* buttons: pill-shaped like the site (red primary, dark outline secondary) */
.btn {
  border: 1.5px solid var(--ink); background: var(--surface); color: var(--ink);
  padding: 10px 20px; border-radius: 100px; letter-spacing: .01em;
  cursor: pointer; font-weight: 600; font-size: 14.5px; white-space: nowrap;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  transition: background .15s, color .15s, border-color .15s, transform .15s;
}
a.btn { text-decoration: none; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn.danger { border-color: var(--line); color: var(--bad); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.sm { padding: 6px 14px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: default; }
.btn:active { transform: translateY(1px); filter: brightness(.94); }
/* per-row actions: the site's red text link with arrow */
td .btn.sm:not(.primary) { border-color: transparent; background: transparent; color: var(--link); padding: 6px 0 6px 8px; font-weight: 700; }
td .btn.sm:not(.primary)::after { content: "→"; font-weight: 400; transition: transform .2s; }
/* hover only where there is a real pointer, so a tapped button does not stay dark on phones */
@media (hover: hover) {
  .btn:hover { background: var(--ink); color: var(--surface); }
  .btn.primary:hover { background: var(--brand-hover); border-color: var(--brand-hover); color: var(--brand-ink); box-shadow: 0 6px 20px rgba(255, 68, 56, .35); }
  .btn.danger:hover { background: var(--bad-bg); color: var(--bad); }
  .btn.ghost:hover { background: var(--surface-2); color: var(--ink); }
  .btn:disabled:hover { background: var(--surface); color: var(--ink); box-shadow: none; }
  .monthnav .btn.sm:hover { background: var(--ink); color: var(--surface); }
  td .btn.sm:not(.primary):hover { background: transparent; color: var(--accent); }
  td .btn.sm:not(.primary):hover::after { transform: translateX(3px); }
}
input[type=text], input[type=email], input[type=tel], input[type=number], input[type=date], input[type=month], input[type=time], input[type=search], input[type=password], select, textarea {
  border: 1px solid var(--field-line); background: var(--surface); border-radius: var(--radius); padding: 10px 12px; min-width: 0; font-size: 15px; transition: border-color .2s, box-shadow .2s;
}
::placeholder { color: var(--ink-3); opacity: 1; }
textarea { resize: vertical; min-height: 80px; width: 100%; line-height: 1.5; }
#settingsForm textarea { field-sizing: content; max-height: 360px; }
/* the site's form focus: red border + soft red ring */
input:focus-visible, select:focus-visible, textarea:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px rgba(255, 68, 56, .12); }
select.pill-select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn:focus-visible, .chip:focus-visible, .seg-btn:focus-visible, nav a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* filters: the site's Monthly / Annual toggle */
.chips { display: inline-flex; gap: 2px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 100px; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.chip { border: 0; background: transparent; padding: 7px 14px; border-radius: 100px; cursor: pointer; font-size: 14px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.chip:hover { color: var(--ink); }
.chip.on { background: var(--ink); color: var(--surface); }
.chip .c { color: var(--ink-3); margin-left: 5px; font-variant-numeric: tabular-nums; font-weight: 500; }
.chip.on .c { color: inherit; opacity: .75; }
/* filter row sits on the page ground, like the site's toggle above the plan cards */
.toolbar { margin-bottom: 14px; }
.toolbar input[type=search], .toolbar select { border-radius: 100px; padding-inline: 16px; }
.filter-search { width: 200px; }

/* status pills */
.pill { display: inline-block; padding: 3px 11px; border-radius: 100px; font-size: 12.5px; font-weight: 700; white-space: nowrap; }
.s-new, .s-requested { background: var(--ink); color: var(--surface); }
.s-scheduled, .s-onboarding { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.s-call-booked, .s-in-progress, .s-visited, .s-vetting, .s-paused { background: var(--warn-bg); color: var(--warn); }
.s-call-done, .s-proposal-sent, .s-quoted, .s-approved { background: var(--muted-bg); color: var(--ink); }
.s-won, .s-done, .s-paid, .s-active, .s-report-sent { background: var(--good-bg); color: var(--good); }
.s-unpaid, .s-overdue, .s-rejected { background: var(--bad-bg); color: var(--bad); }
.s-lost, .s-muted, .s-cancelled, .s-skipped, .s-declined { background: var(--muted-bg); color: var(--ink-2); }
select.pill-select { padding: 5px 10px; border-radius: 100px; font-size: 12.5px; font-weight: 700; border: 0; cursor: pointer; }

/* soft red callout with accent rule (site "why this exists" box) */
.callout { background: var(--brand-soft); border-left: 3px solid var(--accent); border-radius: var(--radius); padding: 12px 16px; color: var(--ink); }

/* tables */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 14px 16px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
th { font-size: 11.5px; font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: .1em; background: transparent; border-bottom-color: var(--line); }
.table-wrap th, .table-wrap td:first-child { white-space: nowrap; }
tbody tr.clickable { cursor: pointer; }
tbody tr.clickable:hover { background: var(--surface-2); }
tbody tr:last-child td { border-bottom: 0; }
td .name, .list .name { font-weight: 700; }
.empty { padding: 40px 20px; text-align: center; color: var(--ink-3); }
.empty .btn { margin: 4px; }

/* lists */
.list { list-style: none; margin: 0; padding: 0; }
.list li { padding: 14px 24px; border-bottom: 1px solid var(--line-soft); display: flex; gap: 12px; align-items: center; justify-content: space-between; }
.list li:last-child { border-bottom: 0; }
.list li.clickable { cursor: pointer; }
.list li.clickable:hover { background: var(--surface-2); }
tr.clickable:focus-visible, li.clickable:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; background: var(--surface-2); }
.list.card li { padding-inline: 18px; }

.progress { height: 6px; background: var(--muted-bg); border-radius: 100px; overflow: hidden; margin-top: 10px; }
.progress > span { display: block; height: 100%; background: var(--accent); border-radius: 100px; }

/* month navigation: a pill like the plan toggle */
.monthnav { display: inline-flex; align-items: center; gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 100px; }
.monthnav .btn.sm { border-color: transparent; padding: 6px 12px; }
.monthnav .label { min-width: 150px; text-align: center; font-weight: 700; }

/* bars (single-series horizontal) */
.bars { display: flex; flex-direction: column; gap: 10px; padding: 20px 24px; }
.bar-row { display: grid; grid-template-columns: minmax(90px, 170px) 1fr 76px; gap: 12px; align-items: center; font-size: 14px; }
.bar-row .lbl { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-track { height: 8px; position: relative; background: var(--muted-bg); border-radius: 100px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--bar); border-radius: 100px; min-width: 8px; }
.bar-row:hover .bar-fill { background: var(--accent); }
.bar-row .v { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); font-weight: 600; }

/* vertical trend columns */
.trend { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 12px; align-items: end; height: 180px; padding: 20px 16px 0; border-bottom: 1px solid var(--line); margin: 0 24px; }
.trend .colbar { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; gap: 6px; position: relative; }
.trend .colbar .val { font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.trend .colbar .b { width: min(40px, 70%); background: var(--bar); border-radius: 4px 4px 0 0; min-height: 2px; }
.trend .colbar.cur .b { background: var(--accent); }
.trend-labels { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 12px; margin: 0 24px; padding: 8px 16px 18px; font-size: 12.5px; color: var(--ink-3); text-align: center; }

.target { padding: 18px 24px; }
.target .progress { height: 10px; }

.plan-table { width: 100%; }
.plan-table td, .plan-table th { padding: 6px 4px; border: 0; background: none; }
.plan-table input { width: 100%; }
.plan-table th:first-child { width: 34%; }

/* modal */
dialog {
  border: 1px solid var(--line); border-radius: 20px; padding: 0; width: min(720px, calc(100vw - 32px));
  background: var(--surface); color: var(--ink); box-shadow: var(--shadow-lg);
}
dialog.wide { width: min(900px, calc(100vw - 32px)); }
dialog::backdrop { background: var(--backdrop); }
.modal-form { display: flex; flex-direction: column; max-height: calc(100vh - 64px); }
.modal-head { display: flex; align-items: center; justify-content: space-between; padding: 20px 24px; border-bottom: 1px solid var(--line-soft); gap: 10px; }
.modal-head h2 { font-size: 21px; }
.modal-body { padding: 20px 24px; overflow-y: auto; }
.modal-foot { display: flex; gap: 10px; padding: 16px 24px; border-top: 1px solid var(--line-soft); align-items: center; flex-wrap: wrap; background: var(--surface-2); border-radius: 0 0 20px 20px; }
/* footer groups: extra actions | Cancel + Save. Flat on desktop, two rows on phones */
.modal-extra, .modal-main { display: contents; }
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 16px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field.full { grid-column: 1 / -1; }
.field > span { font-size: 13px; font-weight: 700; color: var(--ink-2); }
.field input, .field select { width: 100%; }
.check { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.check input { accent-color: var(--brand); width: 18px; height: 18px; }
.section-title { font-size: 12px; font-weight: 700; color: var(--accent-text); text-transform: uppercase; letter-spacing: .2em; margin: 24px 0 10px; }
/* the site's eyebrow: "—— " in the bright red, label text in the darker (legible) red */
.eyebrow::before, .section-title::before { content: "—— "; color: var(--accent); }
.activity { list-style: none; margin: 0; padding: 0; border-left: 2px solid var(--line); }
.activity li { padding: 4px 0 10px 14px; position: relative; }
.activity li::before { content: ""; position: absolute; left: -5px; top: 11px; width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.activity li.note::before { background: var(--accent); }
.activity .when { font-size: 12px; color: var(--ink-3); }

/* inverse snackbar; moved into the open <dialog> by toast() so it shows above the modal */
#toast {
  position: fixed; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); left: 16px; right: 16px; width: max-content; max-width: min(520px, calc(100vw - 32px)); margin-inline: auto;
  transform: translateY(20px); opacity: 0; text-align: center;
  background: var(--ink); color: var(--surface); padding: 12px 20px; border-radius: 22px; font-weight: 600; font-size: 14px;
  transition: .2s; pointer-events: none; z-index: 20; box-shadow: 0 0 0 1px var(--line), var(--shadow-lg);
}
#toast.show { opacity: 1; transform: none; }
#modal #toast { bottom: auto; top: calc(12px + env(safe-area-inset-top, 0px)); }

.report-head-print { display: none; }

/* ---------- footer (dark, as on the site) ---------- */
.site-footer { background: var(--night); color: var(--night-muted); font-size: 13.5px; border-top: 1px solid var(--footer-line); }
.site-footer .container { display: flex; align-items: center; justify-content: space-between; gap: 12px 24px; flex-wrap: wrap; padding-block: 28px; }
.site-footer b { color: #fff; font-family: var(--display); font-weight: 600; font-size: 17px; margin-right: 10px; display: inline-flex; align-items: center; gap: 8px; vertical-align: middle; }
.site-footer b img { width: 26px; height: 26px; display: block; }
.site-footer a { color: #d9d8e3; text-decoration: none; }
.site-footer a:hover { color: #fff; }
.site-footer .links { display: flex; gap: 18px; flex-wrap: wrap; }

/* ---------- visit report ---------- */
.vr-section { margin-bottom: 18px; }
.vr-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px 16px; }
.vr-grid .field input, .vr-grid .field select { width: 100%; }
.nowrap { flex-wrap: nowrap; }
.nowrap input { flex: 1; min-width: 0; }
.nowrap input[type=time] { min-width: 128px; }
.checklist li { gap: 12px; flex-wrap: wrap; }
.ck-label { flex: 1; min-width: 180px; font-weight: 600; }
.seg { display: inline-flex; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 100px; flex: none; background: var(--surface); }
.seg-btn { border: 0; background: transparent; padding: 7px 14px; border-radius: 100px; cursor: pointer; font-weight: 700; font-size: 13px; color: var(--ink-2); min-width: 54px; }
.seg-btn:hover { color: var(--ink); background: var(--surface-2); }
.seg-btn.on.ok { background: var(--good); color: var(--surface); }
.seg-btn.on.issue { background: var(--brand); color: var(--brand-ink); }
.seg-btn.on.na { background: var(--ink); color: var(--surface); }
.problem { align-items: flex-start; flex-wrap: wrap; }
.problem .row b { overflow-wrap: anywhere; }
.problem > div:first-child { flex: 1 1 260px; }
.thumbs-mini { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.thumbs-mini img { width: 52px; height: 52px; object-fit: cover; border-radius: 8px; }
.add-problem { display: grid; grid-template-columns: 2fr 130px 2fr auto; gap: 10px; border-top: 1px solid var(--line-soft); }
.upload-btn { cursor: pointer; padding: 12px 22px; }
.media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; margin-top: 16px; }
.media-item { margin: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface-2); display: flex; flex-direction: column; }
.media-item img, .media-item video { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; background: var(--muted-bg); max-width: 100%; }
.media-item figcaption { padding: 10px; display: flex; flex-direction: column; gap: 6px; }
.media-item figcaption input, .media-item figcaption select { width: 100%; min-width: 0; }
.selectable { user-select: all; }
#uploadStatus { margin-top: 8px; color: var(--ink-2); }

/* client report preview inside the app (always the light report look) */
.report-preview { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: #fff; color-scheme: light; }
.report-preview .cr { padding: 24px 20px; }

/* standalone exported page (Download for printing) */
body.printable { display: block; padding: 24px; background: #fff; }
body.printable .no-print { display: none !important; }
body.printable .report-head-print { display: block; margin-bottom: 12px; }

/* ---------- responsive ---------- */
/* the inline menu needs about 1280px with the logo and the CTA; below that it gets its own scrolling row */
@media (max-width: 1279px) {
  .header-inner { flex-wrap: wrap; gap: 8px 16px; min-height: 0; padding-block: 12px 0; }
  nav { order: 3; flex: 1 0 100%; justify-content: flex-start; overflow-x: auto; scrollbar-width: none; margin-inline: -12px; padding: 4px 4px 8px; }
  .header-cta { margin-left: auto; }
}
/* tablets: four tiles in one row instead of 3 + an orphan */
@media (min-width: 761px) and (max-width: 1100px) {
  .stats:has(> .stat:nth-child(4):last-child) { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}
@media (max-width: 760px) {
  .container { padding-inline: 16px; }
  .topbar .tagline { display: none; }
  .topbar .container { justify-content: flex-end; min-height: 34px; }
  .brand-logo { height: 38px; }
  .brand-mark { font-size: 22px; }
  .brand-mark img { width: 36px; height: 36px; }
  .brand-tag { display: none; }
  .header-cta { padding: 8px 14px; font-size: 13.5px; }
  nav a { font-size: 14.5px; padding: 8px 10px; }
  /* scrolling rows fade at the edge so it is clear there is more */
  nav { padding-inline: 12px 36px; -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 14px, #000 calc(100% - 40px), transparent); mask-image: linear-gradient(90deg, transparent 0, #000 14px, #000 calc(100% - 40px), transparent); }
  .chips { padding-right: 30px; -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 32px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 32px), transparent); }
  .toolbar .row > .spacer { display: none; }
  .toolbar .row > input[type=search], .toolbar .row > select { flex: 1 1 140px; width: auto; }
  main { padding-block: 22px 56px; }
  .page-head { margin-bottom: 18px; }
  .page-head .sub { font-size: 15px; }
  .page-head .row { width: 100%; gap: 8px; }
  .page-head .row .btn { padding: 9px 15px; font-size: 13.5px; }
  .page-head .btn:disabled { display: none; }
  .grid-2, .grid-3 { grid-template-columns: 1fr; }
  .fields { grid-template-columns: 1fr; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .stat { padding: 16px; }
  .stat .value { font-size: 24px; }
  .stat .label { font-size: 11px; letter-spacing: .1em; }
  .stats > .stat:first-child:nth-last-child(odd) { grid-column: 1 / -1; }
  .card-pad { padding: 18px 16px; }
  .card-head { padding: 16px; }
  .list li { padding: 12px 16px; }
  th, td { padding: 12px; }
  .table-wrap th, .table-wrap td { white-space: nowrap; }
  .table-wrap td.wrap { white-space: normal; min-width: 240px; }
  .plan-table thead { display: none; }
  .plan-table, .plan-table tbody { display: block; }
  .plan-table tr { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 12px 0; border-bottom: 1px solid var(--line-soft); }
  .plan-table td { padding: 0; }
  .plan-table td:first-child { grid-column: 1 / -1; }
  .plan-table td:first-child input { font-weight: 700; }
  .plan-table td[data-label]::before { content: attr(data-label); display: block; font-size: 12px; font-weight: 700; color: var(--ink-2); margin-bottom: 4px; }
  .bars { padding: 16px; }
  .monthnav { flex: 1; justify-content: space-between; }
  .monthnav .label { min-width: 0; flex: 1; }
  .add-problem { grid-template-columns: 1fr; }
  .checklist .ck-label { flex-basis: 100%; }
  .checklist .seg { display: flex; width: 100%; }
  .checklist .seg-btn { flex: 1; min-height: 44px; font-size: 14px; }
  .modal-head, .modal-body, .modal-foot { padding-inline: 16px; }
  /* modals become bottom sheets */
  dialog, dialog.wide { width: 100%; max-width: 100%; margin: auto 0 0; border-radius: 20px 20px 0 0; border-width: 1px 0 0; }
  dialog[open] { max-height: 100dvh; }
  .modal-form { max-height: calc(100dvh - 24px); }
  .modal-foot { border-radius: 0; gap: 8px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
  .modal-foot > .spacer { display: none; }
  .modal-extra { display: flex; flex-wrap: wrap; gap: 8px; flex: 1 1 100%; }
  .modal-extra .btn { padding: 8px 14px; font-size: 13.5px; }
  .modal-main { display: flex; gap: 8px; flex: 1 1 100%; }
  .modal-main .btn { flex: 1; }
  .modal-main .btn.primary { flex: 2; }
  .site-footer .container { padding-block: 22px; }
}

/* ---------- touch ---------- */

/* ---------- print (reports) ---------- */

  .card { break-inside: avoid; }

}

  * { transition: none !important; }

<script>
/* Estia CRM – data layer. Everything lives in localStorage under one key. */
(function () {
  const KEY = 'estia-crm:v2';

  const LEAD_STATUSES = ['New', 'Call booked', 'Call done', 'Proposal sent', 'Won', 'Lost'];
  const MEMBER_STATUSES = ['Onboarding', 'Active', 'Paused', 'Cancelled'];
  const VISIT_STATUSES = ['Scheduled', 'Visited', 'Report sent', 'Skipped'];
  const JOB_STATUSES = ['Requested', 'Quoted', 'Approved', 'In progress', 'Done', 'Declined'];
  const PARTNER_STATUSES = ['New', 'Call done', 'Vetting', 'Approved', 'Rejected'];

  // Mirrors estiagreekhome.online (plans page, contact form, partner forms).
  const DEFAULT_SETTINGS = {
    businessName: 'Estia Greek Home',
    currency: 'EUR',
    vatRate: 24,
    onboardingFee: 100,
    monthlyRevenueTarget: 0,
    plans: [
      { name: 'Essential', monthly: 79, annual: 948, visits: 1 },
      { name: 'Recommended', monthly: 119, annual: 1428, visits: 2 },
      { name: 'Premium', monthly: 199, annual: 2388, visits: 4 }
    ],
    services: [
      'Maintenance & Oversight',
      'Bills, Admin & Building',
      'Renovation Oversight',
      'Airbnb & STR',
      'Arrival & Departure',
      'Concierge & Lifestyle',
      'Vehicle Care'
    ],
    sources: ['Website form', 'WhatsApp', 'Email', 'Phone', 'Instagram', 'Facebook', 'Referral', 'Partner', 'Other'],
    audiences: ['Greek abroad', 'International owner', 'Investor'],
    regions: ['Athens', 'Athens Riviera', 'Thessaloniki', 'Peloponnese', 'Kalamata & Costa Navarino', 'Halkidiki', 'Pelion', 'Evia', 'Islands', 'Other'],
    propertyTypes: ['Apartment', 'House', 'Villa', 'Multiple units'],
    visitFrequencies: ['Monthly', 'Quarterly', 'Once or twice a year', 'Rarely'],
    partnerTracks: ['Trade partner', 'Professional partner', 'Referral / community partner'],
    // "What every visit covers" on estiagreekhome.online
    checklist: [
      'Full interior walk-through',
      'Rooms aired and ventilated',
      'Leak, moisture and odour scan',
      'Plumbing and drains tested',
      'Balcony, terrace, external drains',
      'Electric panel visual check',
      'Indoor plants watered',
      'Mail collected and forwarded'
    ]
  };

  const COLLECTIONS = ['leads', 'members', 'visits', 'jobs', 'partners'];

  function empty() {
    const d = { settings: structuredClone(DEFAULT_SETTINGS) };
    COLLECTIONS.forEach(c => d[c] = []);
    return d;
  }

  function normalise(data) {
    const d = empty();
    d.settings = Object.assign(d.settings, data.settings || {});
    COLLECTIONS.forEach(c => { if (Array.isArray(data[c])) d[c] = data[c]; });
    return d;
  }

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      return raw ? normalise(JSON.parse(raw)) : empty();
    } catch (e) {
      console.error('Could not read saved data', e);
      return empty();
    }
  }

  let db = load();

  function save() {
    scheduleFlush();
    try { localStorage.setItem(KEY, JSON.stringify(db)); return true; }
    catch (e) { console.error('Could not save', e); return false; }
  }

  /* ---- optional remote sync (Claude artifact db) ----
     Data is split into shard documents so none gets near the per-document size cap:
     settings, members, partners, leads_<year>, visits_<month>, jobs_<month>. */
  let remote = null, flushTimer = null, flushing = false, lastWritten = {};
  const listeners = new Set();
  let syncStatus = 'local';
  const setStatus = (s) => { syncStatus = s; listeners.forEach(fn => fn(s)); };

  function shards() {
    const out = { settings: { settings: db.settings }, members: { items: db.members }, partners: { items: db.partners } };
    const put = (key, item) => { (out[key] ||= { items: [] }).items.push(item); };
    db.leads.forEach(l => put('leads_' + String(l.createdAt || '').slice(0, 4), l));
    db.visits.forEach(v => put('visits_' + (v.month || 'none'), v));
    db.jobs.forEach(j => put('jobs_' + (j.month || 'none'), j));
    return out;
  }

  function scheduleFlush() {
    if (!remote) return;
    clearTimeout(flushTimer);
    setStatus('saving');
    flushTimer = setTimeout(flush, 700);
  }

  async function flush() {
    if (!remote) return;
    if (flushing) { scheduleFlush(); return; }
    flushing = true;
    try {
      const now = shards();
      for (const [key, body] of Object.entries(now)) {
        const json = JSON.stringify(body);
        if (lastWritten[key] === json) continue;
        await remote.write(key, body);
        lastWritten[key] = json;
      }
      for (const key of Object.keys(lastWritten)) {
        if (!(key in now)) { await remote.del(key); delete lastWritten[key]; }
      }
      setStatus('synced');
    } catch (e) {
      console.error('Sync failed', e);
      setStatus('error');
    } finally { flushing = false; }
  }

  // Drop undefined keys so they don't overwrite defaults in Object.assign.
  const clean = (o) => Object.fromEntries(Object.entries(o).filter(([, v]) => v !== undefined));
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const now = () => new Date().toISOString();
  const monthKey = (d = new Date()) => {
    const x = new Date(d);
    return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}`;
  };
  const shiftMonth = (key, delta) => {
    const [y, m] = key.split('-').map(Number);
    return monthKey(new Date(y, m - 1 + delta, 1));
  };
  const daysInMonth = (key) => { const [y, m] = key.split('-').map(Number); return new Date(y, m, 0).getDate(); };

  const DEFAULTS = {
    leads: () => ({ status: 'New', source: 'Website form', activity: [] }),
    members: () => ({ status: 'Onboarding', plan: 'Recommended', billing: 'Monthly', reportChannel: 'WhatsApp', startDate: new Date().toISOString().slice(0, 10) }),
    visits: () => ({ status: 'Scheduled', issues: '', checklist: {}, problems: [], media: [] }),
    jobs: () => ({ status: 'Requested', price: 0, cost: 0, paid: false }),
    partners: () => ({ status: 'New', activity: [] })
  };

  const Store = {
    LEAD_STATUSES, MEMBER_STATUSES, VISIT_STATUSES, JOB_STATUSES, PARTNER_STATUSES, DEFAULT_SETTINGS,
    uid, now, monthKey, shiftMonth, daysInMonth,

    get settings() { return db.settings; },
    all(col) { return db[col]; },
    get(col, id) { return db[col].find(x => x.id === id); },

    save(col, data) {
      let item = data.id && this.get(col, data.id);
      if (item) {
        if (data.status && item.status && data.status !== item.status && item.activity) {
          item.activity.push({ at: now(), text: `Status: ${item.status} → ${data.status}` });
        }
        Object.assign(item, clean(data), { updatedAt: now() });
      } else {
        item = Object.assign({ id: uid(), createdAt: now() }, DEFAULTS[col](), clean(data));
        db[col].push(item);
      }
      save();
      return item;
    },

    remove(col, id) {
      db[col] = db[col].filter(x => x.id !== id);
      if (col === 'members') {
        db.visits = db.visits.filter(v => v.memberId !== id);
        db.jobs.forEach(j => { if (j.memberId === id) j.memberId = ''; });
        db.leads.forEach(l => { if (l.memberId === id) delete l.memberId; });
      }
      if (col === 'partners') db.jobs.forEach(j => { if (j.partnerId === id) j.partnerId = ''; });
      save();
    },

    addNote(col, id, text) {
      const x = this.get(col, id);
      if (!x || !text.trim()) return;
      (x.activity ||= []).push({ at: now(), text: text.trim(), note: true });
      save();
    },

    updateSettings(patch) { Object.assign(db.settings, patch); save(); },

    plan(name) { return db.settings.plans.find(p => p.name === name); },

    /* Monthly recurring revenue (ex VAT) for one member; annual plans spread over 12 months. */
    memberMRR(m) {
      const p = this.plan(m.plan);
      if (!p) return 0;
      return m.billing === 'Annual' ? p.annual / 12 : p.monthly;
    },

    /* Was this member billable in the given month? */
    activeIn(m, mk) {
      if (m.status === 'Onboarding' || m.status === 'Paused') return false;
      const start = (m.startDate || m.createdAt || '').slice(0, 7);
      if (start && start > mk) return false;
      if (m.status === 'Cancelled') {
        const end = (m.endDate || m.updatedAt || '').slice(0, 7);
        if (!end || end < mk) return false;
      }
      return true;
    },

    convertLead(leadId) {
      const l = this.get('leads', leadId);
      if (!l) return null;
      const m = this.save('members', {
        name: l.name, email: l.email || '', phone: l.phone || '',
        livesIn: l.ownerLocation || '', propertyAddress: l.propertyLocation || '',
        propertyType: l.propertyType || '', audience: l.audience || '',
        plan: l.interestedPlan || 'Recommended', leadId: l.id, notes: l.message || ''
      });
      this.save('leads', { id: l.id, status: 'Won', memberId: m.id });
      return m;
    },

    /* Create this month's scheduled visits for every active member, per their plan. Skips existing ones. */
    generateVisits(mk) {
      let n = 0;
      const dim = daysInMonth(mk);
      db.members.filter(m => m.status === 'Active' && this.activeIn(m, mk)).forEach(m => {
        const want = this.plan(m.plan)?.visits || 1;
        const have = db.visits.filter(v => v.memberId === m.id && v.month === mk).length;
        for (let i = have; i < want; i++) {
          // Spread visits evenly through the month.
          const day = Math.min(dim, Math.max(1, Math.round(((i + 0.5) * dim) / want)));
          db.visits.push({ id: uid(), createdAt: now(), memberId: m.id, month: mk, date: `${mk}-${String(day).padStart(2, '0')}`, status: 'Scheduled', issues: '' });
          n++;
        }
      });
      save();
      return n;
    },

    /* ---- sync ---- */
    get syncStatus() { return syncStatus; },
    onSyncStatus(fn) { listeners.add(fn); },
    /* adapter: {load(): Promise<{key: body}>, write(key, body), del(key)} */
    async connectRemote(adapter) {
      setStatus('loading');
      const docs = await adapter.load();
      const keys = Object.keys(docs);
      remote = adapter;
      if (keys.length) {
        const d = { settings: docs.settings?.settings || {} };
        COLLECTIONS.forEach(c => d[c] = []);
        keys.forEach(k => {
          const col = k.split('_')[0];
          if (COLLECTIONS.includes(col) && Array.isArray(docs[k].items)) d[col].push(...docs[k].items);
        });
        db = normalise(d);
        keys.forEach(k => { lastWritten[k] = JSON.stringify(docs[k]); });
        try { localStorage.setItem(KEY, JSON.stringify(db)); } catch {}
        setStatus('synced');
      } else {
        await flush();   // first run: push whatever this browser already has
      }
      return keys.length > 0;
    },

    /* ---- backup ---- */
    exportJSON() { return JSON.stringify(db, null, 2); },
    importJSON(text) {
      const data = JSON.parse(text);
      if (!data || !Array.isArray(data.leads) || !Array.isArray(data.members)) throw new Error('This file is not an Estia CRM backup.');
      db = normalise(data);
      save();
    },
    reset() { db = empty(); save(); },

    loadDemo() {
      const m0 = monthKey(), m1 = shiftMonth(m0, -1), m2 = shiftMonth(m0, -2), m3 = shiftMonth(m0, -3);
      const at = (mk, d) => `${mk}-${String(d).padStart(2, '0')}T10:00:00.000Z`;
      const lead = (o) => db.leads.push(Object.assign({ id: uid(), activity: [], source: 'Website form', status: 'New' }, o));
      lead({ name: 'Helen Stavrou', email: 'helen@example.com', phone: '+61 400 000 001', ownerLocation: 'Melbourne', propertyLocation: 'Kalamata', propertyType: 'House', visitFrequency: 'Once or twice a year', audience: 'Greek abroad', message: 'My late father\'s house has been empty since spring. Worried about humidity.', createdAt: at(m0, 2) });
      lead({ name: 'James Carter', email: 'james@example.com', phone: '+44 7700 900002', ownerLocation: 'London', propertyLocation: 'Glyfada', propertyType: 'Apartment', visitFrequency: 'Quarterly', audience: 'International owner', status: 'Call booked', callDate: new Date(Date.now() + 864e5).toISOString().slice(0, 10), message: 'Bought last year, insurance asked about vacancy.', createdAt: at(m0, 1) });
      lead({ name: 'Nick Pappas', email: 'nick@example.com', phone: '+1 312 555 0103', ownerLocation: 'Chicago', propertyLocation: 'Thessaloniki', propertyType: 'Apartment', visitFrequency: 'Rarely', audience: 'Greek abroad', status: 'Proposal sent', interestedPlan: 'Essential', followUp: new Date().toISOString().slice(0, 10), createdAt: at(m1, 22) });
      lead({ name: 'Sofia Laine', email: 'sofia@example.com', source: 'Instagram', ownerLocation: 'Helsinki', propertyLocation: 'Pelion', propertyType: 'Villa', audience: 'International owner', status: 'Lost', lostReason: 'Outside coverage / price', createdAt: at(m1, 9) });
      lead({ name: 'Mark Rossi', email: 'mark@example.com', source: 'Referral', ownerLocation: 'Toronto', propertyLocation: 'Athens Riviera', propertyType: 'Multiple units', audience: 'Investor', status: 'Won', createdAt: at(m2, 14) });

      const mem = (o) => { const m = Object.assign({ id: uid(), createdAt: now(), status: 'Active', billing: 'Monthly', reportChannel: 'WhatsApp', onboardingPaid: true }, o); db.members.push(m); return m; };
      const a = mem({ name: 'Anna Georgiou', email: 'anna@example.com', phone: '+61 400 000 010', livesIn: 'Sydney', propertyAddress: 'Kolonaki, Athens', region: 'Athens', propertyType: 'Apartment', audience: 'Greek abroad', plan: 'Recommended', startDate: `${m3}-05`, keysHeld: true });
      const b = mem({ name: 'Mark Rossi', email: 'mark@example.com', phone: '+1 416 555 0199', livesIn: 'Toronto', propertyAddress: 'Vouliagmeni villa', region: 'Athens Riviera', propertyType: 'Villa', audience: 'Investor', plan: 'Premium', billing: 'Annual', startDate: `${m2}-20`, keysHeld: true, reportChannel: 'Email' });
      const c = mem({ name: 'Claire Dubois', email: 'claire@example.com', livesIn: 'Lyon', propertyAddress: 'Stoupa', region: 'Kalamata & Costa Navarino', propertyType: 'House', audience: 'International owner', plan: 'Essential', startDate: `${m1}-03`, keysHeld: true });
      mem({ name: 'Peter Nikolaou', email: 'peter@example.com', livesIn: 'Boston', propertyAddress: 'Kalamaria, Thessaloniki', region: 'Thessaloniki', propertyType: 'Apartment', audience: 'Greek abroad', plan: 'Essential', status: 'Onboarding', startDate: `${m0}-15`, onboardingPaid: false });

      const visit = (memberId, mk, day, status, issues = '') => {
        const done = status !== 'Scheduled';
        db.visits.push({ id: uid(), createdAt: now(), memberId, month: mk, date: `${mk}-${String(day).padStart(2, '0')}`, status, issues,
          reportSentAt: status === 'Report sent' ? `${mk}-${String(day).padStart(2, '0')}` : '',
          arrivedAt: done ? '10:15' : '', leftAt: done ? '10:55' : '', humidity: done ? (issues ? 68 : 55) : '', temperature: done ? 21 : '',
          checklist: done ? Object.fromEntries(db.settings.checklist.map(c => [c, { status: issues && /Leak/.test(c) ? 'issue' : 'ok' }])) : {},
          problems: issues ? [{ id: uid(), text: issues, severity: 'Medium', action: 'Send a plumber this week', status: 'Open', at: now() }] : [],
          media: [] });
      };
      [m2, m1].forEach(mk => { visit(a.id, mk, 8, 'Report sent'); visit(a.id, mk, 22, 'Report sent', mk === m1 ? 'Small leak under kitchen sink' : ''); });
      [8, 15, 22, 28].forEach((d, i) => visit(b.id, m1, d, 'Report sent', i === 2 ? 'Pool pump noisy' : ''));
      visit(c.id, m1, 18, 'Report sent');
      visit(a.id, m0, 8, 'Report sent'); visit(a.id, m0, 22, 'Scheduled');
      [8, 15].forEach(d => visit(b.id, m0, d, 'Visited')); [22, 28].forEach(d => visit(b.id, m0, d, 'Scheduled'));
      visit(c.id, m0, 16, 'Scheduled');

      const pid = uid();
      db.partners.push({ id: pid, createdAt: at(m1, 2), track: 'Trade partner', name: 'Yannis Plumbing', company: 'Yannis K. Plumbing', email: 'yannis@example.com', phone: '+30 690 000 0020', trade: 'Plumber (υδραυλικός)', area: 'Central Athens, Glyfada', rate: '€50 call-out + €35/hr', insurance: 'Yes — current and active', status: 'Approved', activity: [] });
      db.partners.push({ id: uid(), createdAt: at(m0, 3), track: 'Referral / community partner', name: 'Greek Community Club Melbourne', email: 'club@example.com', area: 'Melbourne', status: 'New', activity: [] });

      const job = (o) => db.jobs.push(Object.assign({ id: uid(), createdAt: now(), paid: false, cost: 0 }, o));
      job({ memberId: a.id, service: 'Maintenance & Oversight', title: 'Fix leak under kitchen sink', month: m1, status: 'Done', price: 140, cost: 90, paid: true, partnerId: pid });
      job({ memberId: b.id, service: 'Maintenance & Oversight', title: 'Pool pump service', month: m0, status: 'Approved', price: 220, cost: 160 });
      job({ memberId: b.id, service: 'Arrival & Departure', title: 'Pre-arrival clean + fridge stock', month: m0, status: 'Quoted', price: 180, cost: 110 });
      job({ memberId: c.id, service: 'Bills, Admin & Building', title: 'Building meeting representation', month: m1, status: 'Done', price: 60, cost: 0, paid: true });
      save();
    }
  };

  window.Store = Store;
})();

</script>
<script>
/* Estia CRM – UI */
(function () {
  const S = window.Store;
  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
  const main = $('#main');
  const modal = $('#modal');
  const modalForm = $('#modalForm');
  const ST = () => S.settings;

  /* ================= helpers ================= */
  const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const slug = (s) => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-');
  const todayISO = () => new Date().toISOString().slice(0, 10);
  const num = (v) => { const n = parseFloat(String(v ?? '').replace(',', '.')); return isFinite(n) ? n : 0; };
  const sum = (arr, f) => arr.reduce((a, x) => a + num(f(x)), 0);
  const pct = (a, b) => b ? Math.round((a / b) * 100) : 0;

  function money(v, cents) {
    try { return new Intl.NumberFormat(undefined, { style: 'currency', currency: ST().currency || 'EUR', maximumFractionDigits: cents ? 2 : 0 }).format(v || 0); }
    catch { return `${Math.round(v || 0)} ${ST().currency}`; }
  }
  const fmtDate = (iso) => iso ? new Date(iso.length === 10 ? iso + 'T00:00:00' : iso).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }) : '';
  const fmtDay = (iso) => iso ? new Date(iso + 'T00:00:00').toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' }) : '';
  const fmtDateTime = (iso) => iso ? new Date(iso).toLocaleString(undefined, { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
  const monthLabel = (key) => { const [y, m] = key.split('-').map(Number); return new Date(y, m - 1, 1).toLocaleDateString(undefined, { month: 'long', year: 'numeric' }); };
  const monthShort = (key) => { const [y, m] = key.split('-').map(Number); return new Date(y, m - 1, 1).toLocaleDateString(undefined, { month: 'short' }); };
  const daysBetween = (a, b) => Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 864e5);

  const pill = (status, extra = '') => `<span class="pill s-${slug(status)}${extra}">${esc(status)}</span>`;
  const options = (list, selected, blank) =>
    (blank !== undefined ? `<option value="">${esc(blank)}</option>` : '') +
    list.map(o => `<option ${o === selected ? 'selected' : ''}>${esc(o)}</option>`).join('') +
    (selected && !list.includes(selected) ? `<option selected>${esc(selected)}</option>` : '');

  const leadOpen = (l) => l.status !== 'Won' && l.status !== 'Lost';
  const member = (id) => S.get('members', id);
  const memberName = (id) => member(id)?.name || '—';
  const waLink = (phone) => phone ? `https://wa.me/${String(phone).replace(/[^\d]/g, '')}` : '';

  function field(name, label, value, type = 'text', extra = '') {
    if (type === 'textarea') return `<label class="field full"><span>${esc(label)}</span><textarea name="${name}" rows="3" ${extra}>${esc(value)}</textarea></label>`;
    if (Array.isArray(type)) return `<label class="field"><span>${esc(label)}</span><select name="${name}" ${extra}>${options(type, value, '— choose —')}</select></label>`;
    if (type === 'checkbox') return `<label class="check"><input type="checkbox" name="${name}" ${value ? 'checked' : ''} ${extra}> ${esc(label)}</label>`;
    return `<label class="field"><span>${esc(label)}</span><input type="${type}" name="${name}" value="${esc(value ?? '')}" ${type === 'number' ? 'step="any" min="0"' : ''} ${extra}></label>`;
  }

  function toast(msg) {
    const t = $('#toast');
    const host = modal.open ? modal : document.body;   // an open modal <dialog> sits in the top layer, above everything else
    if (t.parentNode !== host) host.appendChild(t);
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => t.classList.remove('show'), 2400);
  }

  /* Inside a Claude artifact, files go through the viewer's download prompt; elsewhere a normal link. */
  const IN_ARTIFACT = typeof window.claude?.use === 'function';
  // Set by the Cloudflare build (public/index.html): data and media go to our own server behind a login.
  const API = window.ESTIA_API || '';
  const MAX_VIDEO_MB = API ? 95 : 20;
  let downloadsCap = null;
  async function download(name, text, type = 'text/plain') {
    if (/\.csv$/.test(name)) text = '\ufeff' + text;   // so Excel reads Greek characters correctly
    if (IN_ARTIFACT) {
      if (!downloadsCap) { toast('Downloads are not available in this view'); return; }
      try { await downloadsCap.save({ filename: name, data: text }); toast('Saved ' + name); }
      catch (e) { if (e?.code !== 'declined') toast('Could not save the file'); }
      return;
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type }));
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  /* Print locally; inside an artifact (where printing is blocked) save a standalone page to print. */
  function printView(filename) {
    if (!IN_ARTIFACT) { window.print(); return; }
    const css = [...document.querySelectorAll('style')].map(x => x.textContent).join('\n');
    const html = `<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>${esc(filename)}</title><style>${css}</style></head><body class="printable"><main>${main.innerHTML}</main></body></html>`;
    download(filename + '.html', html, 'text/html');
  }
  const printLabel = () => IN_ARTIFACT ? 'Download to print' : 'Print / PDF';

  const toCSV = (rows) => rows.map(r => r.map(v => { const s = String(v ?? ''); return /[",\n;]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; }).join(',')).join('\n');

  function parseCSV(text) {
    const rows = []; let row = [], cur = '', q = false;
    const delim = (text.split('\n')[0].match(/;/g) || []).length > (text.split('\n')[0].match(/,/g) || []).length ? ';' : ',';
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) {
        if (c === '"' && text[i + 1] === '"') { cur += '"'; i++; }
        else if (c === '"') q = false;
        else cur += c;
      } else if (c === '"') q = true;
      else if (c === delim) { row.push(cur); cur = ''; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i + 1] === '\n') i++;
        row.push(cur); rows.push(row); row = []; cur = '';
      } else cur += c;
    }
    if (cur || row.length) { row.push(cur); rows.push(row); }
    return rows.filter(r => r.some(v => v.trim()));
  }

  /* ---- Website form submissions (Formspree "plain" emails / CSV export) ---- */
  // Website field name -> CRM field, for the discovery-call form and the three partner forms.
  const LEAD_KEYS = { name: 'name', email: 'email', phone: 'phone', location: 'ownerLocation', property_location: 'propertyLocation', property_type: 'propertyType', visit_frequency: 'visitFrequency', message: 'message' };
  const PARTNER_KEYS = {
    name: 'name', email: 'email', phone: 'phone', company: 'company', organisation: 'company', partner_track: 'track',
    trade_type: 'trade', profession: 'trade', referral_type: 'trade', specialism: 'specialism',
    location: 'area', coverage: 'area', years: 'years', liability_insurance: 'insurance', licensing: 'licensing', registration: 'licensing',
    rate: 'rate', languages: 'languages', references: 'references', website: 'website', referrer: 'referrer', message: 'message'
  };
  const IGNORE_KEYS = new Set(['_subject', '_next', '_format', '_gotcha', 'form_origin', 'g-recaptcha-response']);
  const normKey = (k) => String(k).trim().toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');

  /* Turns {website_field: value} into ['lead'|'partner', crmRecord]. */
  function recordFromForm(raw) {
    const origin = String(raw.form_origin || raw.partner_track || '').toLowerCase();
    const isPartner = /partner/.test(origin) || raw.partner_track || raw.trade_type || raw.profession || raw.referral_type;
    const keys = isPartner ? PARTNER_KEYS : LEAD_KEYS;
    const rec = {}, extra = [];
    Object.entries(raw).forEach(([k, v]) => {
      v = String(v ?? '').trim();
      if (!v || IGNORE_KEYS.has(k) || /^(_date|date|created_at|submitted|timestamp)$/.test(k)) return;
      if (keys[k]) rec[keys[k]] = rec[keys[k]] ? rec[keys[k]] + ' · ' + v : v;
      else extra.push(`${k.replace(/_/g, ' ')}: ${v}`);
    });
    if (extra.length) rec.message = [rec.message, extra.join('\n')].filter(Boolean).join('\n\n');
    const when = raw._date || raw.date || raw.created_at || raw.submitted || raw.timestamp;
    const d = when ? new Date(when) : null;
    if (d && !isNaN(d)) rec.createdAt = d.toISOString();
    if (isPartner) {
      rec.track = ST().partnerTracks.find(t => t.toLowerCase().startsWith(String(rec.track || origin.split('/')[1] || '').trim().toLowerCase().split(' ')[0])) || rec.track || 'Trade partner';
      return ['partner', rec];
    }
    rec.source = 'Website form';
    return ['lead', rec];
  }

  function parseFormEmail(text) {
    const raw = {};
    let last = null;
    text.split(/\r?\n/).forEach(line => {
      const m = line.match(/^\s*([A-Za-z_][\w \-/]{0,40}?)\s*:\s*(.*)$/);
      if (m && !/^https?$/i.test(m[1])) {
        const k = normKey(m[1]);
        const alias = { your_name: 'name', full_name: 'name', your_full_name: 'name', whatsapp_or_phone: 'phone', where_do_you_currently_live: 'location',
          where_is_your_property_in_greece: 'property_location', how_often_do_you_currently_visit: 'visit_frequency', what_prompted_you_to_look_into_this: 'message' }[k] || k;
        raw[alias] = m[2]; last = alias;
      } else if (last && line.trim()) raw[last] += '\n' + line.trim();
    });
    if (!raw.email) { const e = text.match(/[\w.+-]+@[\w-]+\.[\w.-]+/); if (e) raw.email = e[0]; }
    return raw;
  }

  function guessRegion(text) {
    const t = String(text || '').toLowerCase();
    const hints = [
      [/riviera|glyfada|voula|vouliagmeni|varkiza|sounio|lagonisi|saronida/, 'Athens Riviera'],
      [/kalamata|pylos|stoupa|kardamyli|navarino|messini/, 'Kalamata & Costa Navarino'],
      [/thessalon|kalamaria|panorama|halki?d?i?k?i?\b/, 'Thessaloniki'],
      [/halkidiki|chalkidiki|kassandra|sithonia/, 'Halkidiki'],
      [/pelion|volos/, 'Pelion'], [/evia|euboea|chalkida/, 'Evia'],
      [/peloponn|mani|argol|nafplio|tripoli|monemvasia/, 'Peloponnese'],
      [/athens|αθήνα|kolonaki|kifisia|marousi|chalandri|piraeus|attica|attiki/, 'Athens'],
      [/crete|heraklion|chania|rhodes|corfu|paros|naxos|mykonos|santorini|syros|tinos|island/, 'Islands']
    ];
    const hit = hints.find(([re]) => re.test(t));
    return hit && ST().regions.includes(hit[1]) ? hit[1] : (t ? 'Other' : '');
  }

  /* ================= modal ================= */
  let onSubmit = null;
  function openModal({ title, body, foot = '', submitLabel = 'Save', onSave, bind, wide }) {
    modalForm.innerHTML = `
      <div class="modal-head"><h2>${esc(title)}</h2><button type="button" class="btn ghost sm" data-close aria-label="Close">✕</button></div>
      <div class="modal-body">${body}</div>
      <div class="modal-foot">${foot ? `<div class="modal-extra">${foot}</div>` : ''}<span class="spacer"></span>
        <div class="modal-main"><button type="button" class="btn" data-close>${onSave ? 'Cancel' : 'Close'}</button>
        ${onSave ? `<button type="submit" class="btn primary">${esc(submitLabel)}</button>` : ''}</div>
      </div>`;
    modal.style.width = '';
    modal.classList.toggle('wide', !!wide);
    onSubmit = onSave || null;
    $$('[data-close]', modalForm).forEach(b => b.addEventListener('click', closeModal));
    if (bind) bind(modalForm);
    focusableRows(modalForm);
    if (!modal.open) modal.showModal();
    $('.modal-body', modalForm).scrollTop = 0;
    // Focus the first field of a new form; on a phone, opening an existing record must not raise the keyboard.
    const first = $('input:not([type=checkbox]):not([type=hidden]), textarea, select', $('.modal-body', modalForm));
    const touch = matchMedia('(pointer: coarse)').matches;
    if (first && !first.closest('details') && !(touch && first.value)) first.focus();
  }
  function closeModal() { if (modal.open) modal.close(); onSubmit = null; }
  modal.addEventListener('close', () => { const t = $('#toast'); if (t.parentNode === modal) document.body.appendChild(t); });
  /* Rows and list items that open a record can be reached with Tab and opened with Enter / Space. */
  function focusableRows(root) { $$('[data-open]:not(a):not(button)', root).forEach(el => { el.tabIndex = 0; }); }
  modalForm.addEventListener('submit', (e) => {
    e.preventDefault();
    if (!onSubmit) return closeModal();
    const data = Object.fromEntries(new FormData(modalForm).entries());
    $$('input[type=checkbox][name]', modalForm).forEach(cb => { data[cb.name] = cb.checked; });
    if (onSubmit(data, modalForm) !== false) { if (modal.open && onSubmit) closeModal(); render(); }
  });

  function confirmBox(text, onYes, label = 'Delete') {
    openModal({ title: 'Are you sure?', body: `<p>${esc(text)}</p>`, submitLabel: label, onSave: () => { onYes(); } });
  }

    const list = (item.activity || []).slice().reverse();

      ${list.length ? `<ul class="activity">${list.map(a => `<li class="${a.note ? 'note' : ''}"><div class="when">${fmtDateTime(a.at)}</div>${esc(a.text)}</li>`).join('')}</ul>` : '<p class="muted small">No notes yet.</p>'}`;
  }
  function bindNotes(root, col, id, reopen) {
    const add = () => { const v = $('#noteInput', root).value; if (!v.trim()) return; S.addNote(col, id, v); reopen(S.get(col, id)); };
    $('#noteAdd', root)?.addEventListener('click', add);
    $('#noteInput', root)?.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); add(); } });

  /* ================= state ================= */
  const state = {

  function barList(pairs, fmt = (v) => v) {
    pairs = pairs.filter(p => p[1]);
    if (!pairs.length) return `<div class="empty">No data for this period.</div>`;
    const max = Math.max(...pairs.map(p => p[1]));
    return `<div class="bars">${pairs.map(([l, v]) => `

        <span class="lbl">${esc(l)}</span>
        <div class="bar-track"><div class="bar-fill" style="width:${(v / max) * 100}%"></div></div>
        <span class="v">${esc(fmt(v))}</span>
      </div>`).join('')}</div>`;
  }
  function monthNav(key, attr) {
    return `<div class="monthnav">

  /* ================= metrics ================= */
  function monthMetrics(mk) {
    const leads = S.all('leads').filter(l => S.monthKey(l.createdAt) === mk);
    const members = S.all('members');
    const active = members.filter(m => S.activeIn(m, mk));
    const started = members.filter(m => (m.startDate || '').slice(0, 7) === mk && m.status !== 'Onboarding');
    const cancelled = members.filter(m => m.status === 'Cancelled' && (m.endDate || '').slice(0, 7) === mk);
    const mrr = sum(active, m => S.memberMRR(m));
    const onboarding = started.filter(m => m.onboardingPaid).length * num(ST().onboardingFee);
    const jobs = S.all('jobs').filter(j => j.month === mk);
    const jobsDone = jobs.filter(j => j.status === 'Done');
    const addOnRevenue = sum(jobsDone, j => j.price);
    const addOnCost = sum(jobsDone, j => j.cost);
    const visits = S.all('visits').filter(v => v.month === mk);
    const visited = visits.filter(v => v.status === 'Visited' || v.status === 'Report sent');
    const reported = visits.filter(v => v.status === 'Report sent');
    const onTime = reported.filter(v => v.reportSentAt && v.date && daysBetween(v.date, v.reportSentAt) <= 1);
    const withIssues = visits.filter(v => (v.issues || '').trim());
    const won = leads.filter(l => l.status === 'Won').length;
    const lost = leads.filter(l => l.status === 'Lost').length;
    const revenue = mrr + onboarding + addOnRevenue;
    return { mk, leads, won, lost, active, started, cancelled, mrr, onboarding, jobs, jobsDone, addOnRevenue, addOnCost,
      visits, visited, reported, onTime, withIssues, revenue, vat: revenue * num(ST().vatRate) / 100 };
  }

      ...followUps.map(l => ({ kind: 'lead', id: l.id, title: l.name, sub: `Follow up · ${l.status}`, tag: `<span class="pill ${l.followUp < today ? 's-overdue' : 's-in-progress'}">${l.followUp < today ? 'Overdue' : 'Today'}</span>`, sort: l.followUp })),
      ...S.all('visits').filter(v => v.status === 'Visited').map(v => ({ kind: 'visit', id: v.id, title: memberName(v.memberId), sub: `Send visit report (visited ${fmtDate(v.date)})`, tag: `<span class="pill ${daysBetween(v.date, today) > 1 ? 's-overdue' : 's-in-progress'}">Report due</span>`, sort: v.date })),
      ...S.all('visits').filter(v => v.status === 'Scheduled' && v.date && v.date < today).map(v => ({ kind: 'visit', id: v.id, title: memberName(v.memberId), sub: `Visit planned ${fmtDate(v.date)} not marked done`, tag: pill('Overdue'), sort: v.date })),
      ...S.all('jobs').filter(j => j.status === 'Requested').map(j => ({ kind: 'job', id: j.id, title: j.title, sub: `Send quote · ${memberName(j.memberId)}`, tag: pill('Requested'), sort: j.createdAt })),
      ...S.all('partners').filter(p => p.status === 'New').map(p => ({ kind: 'partner', id: p.id, title: p.name, sub: `Partner application · ${p.track || ''}`, tag: pill('New'), sort: p.createdAt }))
    ].sort((a, b) => String(a.sort).localeCompare(String(b.sort)));

    const upcoming = S.all('visits').filter(v => v.status === 'Scheduled' && v.date >= today).sort((a, b) => a.date.localeCompare(b.date)).slice(0, 7);
    const pipelineMRR = sum(leads.filter(l => ['Call booked', 'Call done', 'Proposal sent'].includes(l.status)), l => S.plan(l.interestedPlan || 'Recommended')?.monthly || 0);
    const target = num(ST().monthlyRevenueTarget);
    const hour = new Date().getHours();

    return `
      <div class="page-head">
        <div><h1>Good ${hour < 12 ? 'morning' : hour < 18 ? 'afternoon' : 'evening'}</h1>
        <div class="sub">${esc(ST().businessName)} · ${esc(monthLabel(mk))}</div></div>
        <div class="row">
          <button class="btn" data-act="paste-form">Paste form email</button>
          <button class="btn" data-act="new-lead">+ New request</button>
        </div>
      </div>
      <div class="stats">
        ${stat('Active members', m.active.length, `${S.all('members').filter(x => x.status === 'Onboarding').length} onboarding`)}
        ${stat('MRR', money(m.mrr), 'ex VAT · annual plans ÷ 12')}
        ${stat('Revenue this month', money(m.revenue), target ? `${pct(m.revenue, target)}% of ${money(target)} target` : 'subscriptions + onboarding + add-ons')}
        ${stat('Visits this month', `${m.visited.length}/${m.visits.length}`, `${m.reported.length} reports sent`)}
        ${stat('Open requests', leads.filter(leadOpen).length, `${newLeads.length} new · pipeline ${money(pipelineMRR)}/mo`)}
      </div>
      <div class="grid grid-2">
        <section class="card">
          <div class="card-head"><h2>To do</h2><span class="muted small">${todo.length}</span></div>
          ${todo.length ? `<ul class="list">${todo.slice(0, 12).map(t => `
            <li class="clickable" data-open="${t.kind}:${t.id}">
              <div><div class="name">${esc(t.title)}</div><div class="muted small">${esc(t.sub)}</div></div>${t.tag}
            </li>`).join('')}</ul>` : (S.all('leads').length || S.all('members').length ? `<div class="empty">All caught up.</div>` : emptyStart('data'))}
        </section>
        <section class="card">
          <div class="card-head"><h2>Upcoming visits</h2><a href="#month" class="small">Monthly work</a></div>
          ${upcoming.length ? `<ul class="list">${upcoming.map(v => { const mm = member(v.memberId); return `
            <li class="clickable" data-open="visit:${v.id}">
              <div><div class="name">${esc(mm?.name || '—')}</div><div class="muted small">${esc(mm?.propertyAddress || mm?.region || '')}</div></div>
              <span class="muted small">${fmtDay(v.date)}</span>
            </li>`; }).join('')}</ul>` : `<div class="empty">No visits scheduled. Open <a href="#month">Monthly work</a> and generate this month's visits.</div>`}
        </section>
        <section class="card">
          <div class="card-head"><h2>Discovery calls booked</h2><a href="#leads" class="small">All requests</a></div>
          ${calls.length ? `<ul class="list">${calls.slice(0, 6).map(l => `
            <li class="clickable" data-open="lead:${l.id}"><div><div class="name">${esc(l.name)}</div><div class="muted small">${esc([l.ownerLocation, l.propertyLocation].filter(Boolean).join(' → '))}</div></div>
            <span class="muted small">${fmtDate(l.callDate)}</span></li>`).join('')}</ul>` : `<div class="empty">No calls booked.</div>`}

        <section class="card">

        </section>
      </div>`;
  };

  /* ================= requests (leads) ================= */
  function filteredLeads() {
    const f = state.leadFilter, q = f.q.trim().toLowerCase();
    return S.all('leads').filter(l =>
      (f.status === 'All' || (f.status === 'Open' ? leadOpen(l) : l.status === f.status)) &&
      (!f.source || l.source === f.source) &&
      (!q || [l.name, l.email, l.phone, l.message, l.ownerLocation, l.propertyLocation].join(' ').toLowerCase().includes(q))
    ).sort((a, b) => b.createdAt.localeCompare(a.createdAt));
  }

    const f = state.leadFilter, all = S.all('leads');
    const counts = { All: all.length, Open: all.filter(leadOpen).length };
    S.LEAD_STATUSES.forEach(s => counts[s] = all.filter(l => l.status === s).length);

        </div>
      </div>
      <div class="toolbar">
        <div class="row">
          <div class="chips">${['Open', ...S.LEAD_STATUSES, 'All'].map(s => `<button class="chip ${f.status === s ? 'on' : ''}" data-lead-status="${esc(s)}" aria-pressed="${f.status === s}">${esc(s)}<span class="c">${counts[s]}</span></button>`).join('')}</div>
          <span class="spacer"></span>

          <tbody>${list.map(l => {
            const next = l.status === 'Call booked' && l.callDate ? ['Call', l.callDate] : l.followUp && leadOpen(l) ? ['Follow up', l.followUp] : null;
            return `<tr class="clickable" data-open="lead:${l.id}">
              <td class="muted">${fmtDate(l.createdAt)}</td>

        ${field('email', 'Email', l.email, 'email')}
        ${field('phone', 'WhatsApp or phone', l.phone, 'tel')}
        ${field('ownerLocation', 'Where they live', l.ownerLocation, 'text', 'placeholder="e.g. Melbourne, Toronto, London"')}
        ${field('propertyLocation', 'Property in Greece', l.propertyLocation, 'text', 'placeholder="e.g. Glyfada, Kalamata"')}
        ${field('propertyType', 'Property type', l.propertyType, st.propertyTypes)}
        ${field('visitFrequency', 'How often they visit', l.visitFrequency, st.visitFrequencies)}
        ${field('audience', 'Owner type', l.audience, st.audiences)}
        ${field('source', 'Source', l.source || 'Website form', st.sources)}

  function importCSVDialog() {
    openModal({
      title: 'Import from CSV',
      body: `<p class="small muted">Use the CSV export from your Formspree dashboard (Submissions → Export), or any spreadsheet with a header row such as <b>name, email, phone, location, property_location, property_type, visit_frequency, message</b>. Partner-form rows (with <code>form_origin</code> or <code>partner_track</code>) are added to Partners. Rows whose email already exists are skipped.</p>
        <input type="file" id="csvFile" accept=".csv,text/csv">`,
      bind: (root) => {
        $('#csvFile', root).addEventListener('change', async (e) => {
          const file = e.target.files[0];
          if (!file) return;
          const rows = parseCSV(await file.text());
          if (rows.length < 2) { toast('No rows found'); return; }
          const head = rows[0].map(normKey).map(k => ({ your_name: 'name', full_name: 'name', e_mail: 'email', whatsapp_or_phone: 'phone' }[k] || k));
          const seen = new Set([...S.all('leads'), ...S.all('partners')].map(x => (x.email || '').toLowerCase()).filter(Boolean));
          let leads = 0, partners = 0, skipped = 0;
          rows.slice(1).forEach(r => {
            const raw = Object.fromEntries(head.map((k, i) => [k, r[i] ?? '']));
            if (!raw.name && !raw.email) return;
            if (raw.email && seen.has(raw.email.toLowerCase())) { skipped++; return; }
            const [kind, rec] = recordFromForm(raw);
            if (raw.status && S.LEAD_STATUSES.includes(raw.status)) rec.status = raw.status;
            if (raw.source && ST().sources.includes(raw.source)) rec.source = raw.source;
            S.save(kind === 'partner' ? 'partners' : 'leads', rec);
            if (raw.email) seen.add(raw.email.toLowerCase());
            kind === 'partner' ? partners++ : leads++;
          });
          closeModal(); render();
          toast(`Imported ${leads} request${leads === 1 ? '' : 's'}, ${partners} partner${partners === 1 ? '' : 's'}${skipped ? ` · ${skipped} duplicates skipped` : ''}`);
        });
      }
    });
  }

  /* ================= members ================= */
  views.members = () => {
    const f = state.memberFilter, q = f.q.trim().toLowerCase(), mk = S.monthKey();

      </div></div>
      <div class="card table-wrap">
        ${list.length ? `<table><thead><tr><th>Member</th><th>Property</th><th>Plan</th><th class="num">Per month</th><th>Since</th><th>Status</th><th>Last visit</th></tr></thead>
        <tbody>${list.map(m => {
          const last = S.all('visits').filter(v => v.memberId === m.id && v.status !== 'Scheduled' && v.status !== 'Skipped').sort((a, b) => b.date.localeCompare(a.date))[0];

            <td><div class="name">${esc(m.name)}</div><div class="muted small">${esc(m.livesIn || m.email || '')}</div></td>
            <td>${esc(m.propertyAddress || '—')}<div class="muted small">${esc([m.region, m.propertyType].filter(Boolean).join(' · '))}</div></td>
            <td>${esc(m.plan || '—')}<div class="muted small">${esc(m.billing || '')}</div></td>
            <td class="num">${money(S.memberMRR(m))}</td>
            <td class="muted">${fmtDate(m.startDate)}</td>
            <td>${pill(m.status)}</td>
            <td class="muted">${last ? fmtDate(last.date) : '—'}</td></tr>`; }).join('')}</tbody></table>`
        : `<div class="empty">${all.length ? 'No members match.' : 'No members yet. Turn a request into a member with “Make member”, or add one here.'}</div>`}
      </div>`;
  };

  function memberForm(m = {}) {

  /* Printable visit log per member — the "insurance-grade visit log" promised on the plans page. */

  /* ================= monthly work (visits + add-on jobs) ================= */
  views.month = () => {
    const mk = state.workMonth, today = todayISO();
    const visits = S.all('visits').filter(v => v.month === mk).sort((a, b) => (a.date || '').localeCompare(b.date || '') || memberName(a.memberId).localeCompare(memberName(b.memberId)));

          <button class="btn" data-act="gen-visits" ${missing ? '' : 'disabled'}>${missing ? `Generate ${missing} visit${missing === 1 ? '' : 's'} from plans` : 'All plan visits created'}</button>
          <button class="btn" data-act="new-visit">Plan a visit</button>
          <button class="btn" data-act="new-job">+ Add-on job</button>

        <tbody>${visits.map(v => { const mm = member(v.memberId); const late = v.status === 'Scheduled' && v.date < today; const repLate = v.status === 'Visited' && daysBetween(v.date, today) > 1; return `
          <tr class="clickable" data-open="visit:${v.id}">
            <td>${late ? `<span class="pill s-overdue">${fmtDay(v.date)}</span>` : fmtDay(v.date)}</td>

            <td data-stop class="num">${v.status === 'Scheduled' ? `<button class="btn sm" data-open="visit:${v.id}">Start report</button>` : v.status === 'Visited' ? `<button class="btn sm ${repLate ? 'primary' : ''}" data-visit-step="${v.id}">Mark report sent</button>` : ''}${(v.media || []).length ? ` <span class="muted small">📷 ${(v.media || []).length}</span>` : ''}</td>
          </tr>`; }).join('')}</tbody></table>`
          : `<div class="empty">No visits for ${esc(monthLabel(mk))}. ${active.length ? 'Use “Generate visits from plans” to create them for all active members.' : 'Add members first.'}</div>`}</div>

    reports: 'Performance', settings: 'Prices & lists', visit: 'On site', visitlog: 'Records' };
  // One-word page names get a two-word title so they also carry the red italic accent (menu labels and tab titles stay short).
  const TITLE_ACCENT = { leads: 'Discovery requests', members: 'Our members', partners: 'Partner network', reports: 'Monthly reports', settings: 'Workspace settings' };
  function decorateHeading(view) {
    const head = $('.page-head > div:first-child');
    const h1 = head && $('h1', head);
    if (!h1) return;
    if (EYEBROWS[view]) h1.insertAdjacentHTML('beforebegin', `<span class="eyebrow">${esc(EYEBROWS[view])}</span>`);
    if (TITLE_ACCENT[view] && !h1.querySelector('*')) h1.textContent = TITLE_ACCENT[view];
    const words = h1.textContent.trim().split(/\s+/);
    if (words.length > 1 && !h1.querySelector('*')) {
      const last = words.pop();
      h1.innerHTML = `${esc(words.join(' '))} <em>${esc(last)}</em>`;
    }
  }

  /* On phones the menu and the filter chips scroll sideways: bring the current item into view (no-op when nothing overflows). */
  function revealActive() {

      const a = $(on, w);
      if (!a || w.scrollWidth <= w.clientWidth) return;
      const wr = w.getBoundingClientRect(), ar = a.getBoundingClientRect();
      w.scrollLeft += ar.left - wr.left - (wr.width - ar.width) / 2;
    }));
  }
