<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estia CRM</title>
  <link rel="icon" href="assets/favicon.svg">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preload" href="assets/fonts/poppins-500-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/manrope-latin-variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="topbar">
    <div class="container">
      <span class="tagline">Estia CRM · Property care for owners abroad · <a href="https://estiagreekhome.online/" target="_blank" rel="noopener">estiagreekhome.online</a></span>
      <span class="sync" id="syncNote">Saved in this browser</span>
    </div>
  </div>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="#dashboard" aria-label="Estia CRM home">
        <img class="brand-logo" src="assets/estia-lockup-dark.webp" alt="Estia — Trusted Care For Your Greek Home" width="200" height="54">
        <span class="brand-tag">CRM</span>
      </a>
      <nav id="nav" aria-label="Main">
        <a href="#dashboard" data-view="dashboard">Dashboard</a>
        <a href="#leads" data-view="leads">Requests <span class="badge" id="newBadge" hidden></span></a>
        <a href="#members" data-view="members">Members</a>
        <a href="#month" data-view="month">Monthly work</a>
        <a href="#partners" data-view="partners">Partners <span class="badge" id="partnerBadge" hidden></span></a>
        <a href="#reports" data-view="reports">Reports</a>
        <a href="#settings" data-view="settings">Settings</a>
      </nav>
      <button type="button" class="btn primary header-cta" data-act="log-visit">+ Log a visit</button>
    </div>
  </header>

  <main id="main" class="container"></main>

  <footer class="site-footer">
    <div class="container">
      <span><b>Estia</b>Members-only home-watch and property care for owners abroad.</span>
      <span class="links"><a href="https://estiagreekhome.online/" target="_blank" rel="noopener">Website ↗</a><a href="https://wa.me/306977448868" target="_blank" rel="noopener">WhatsApp ↗</a><span>© 2026 Estia</span></span>
    </div>
  </footer>

  <dialog id="modal">
    <form method="dialog" id="modalForm" class="modal-form"></form>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>

  <script>window.ESTIA_API = "/api";</script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
