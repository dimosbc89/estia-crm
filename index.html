<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estia CRM</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%231f4e79'/><path d='M8 24V13l8-6 8 6v11h-5v-6h-6v6z' fill='%23f4efe6'/></svg>">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32"><path d="M8 24V13l8-6 8 6v11h-5v-6h-6v6z"/></svg>
      </span>
      <span class="brand-name" id="brandName">Estia CRM</span>
    </div>
    <nav id="nav">
      <a href="#dashboard" data-view="dashboard">Dashboard</a>
      <a href="#requests" data-view="requests">Requests <span class="badge" id="newBadge" hidden></span></a>
      <a href="#projects" data-view="projects">Monthly projects</a>
      <a href="#clients" data-view="clients">Clients</a>
      <a href="#reports" data-view="reports">Reports</a>
      <a href="#settings" data-view="settings">Settings</a>
    </nav>
    <p class="sidebar-foot">Data is saved in this browser. Back it up regularly from Settings.</p>
  </aside>

  <main id="main"></main>

  <dialog id="modal">
    <form method="dialog" id="modalForm" class="modal-form"></form>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
